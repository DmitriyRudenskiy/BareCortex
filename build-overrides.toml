[page."chapter10/kernel.html"]
skip_blocks = [5]
note = """`mount /boot` is the page's conditional step — “If you've decided to use a
separate /boot partition for the LFS system (maybe sharing a /boot partition with
the host distro), you may need to run mount /boot” — and this build has no
separate /boot: the fstab page writes one root partition and no /boot line, so the
command answers `can't find in /etc/fstab` and the blocks that copy the kernel,
System.map and .config into /boot never run. They are the next blocks and they do
their work against the /boot directory of the root filesystem, which is what the
page installs to when there is no partition to mount.

`make menuconfig` is the page's own step, and it is a person at a keyboard: the
page says so (“Usually, this is done through a menu-driven interface”), and run
unattended it draws an ncurses screen on a pipe and waits forever — it sat at 96%
CPU for two hours and printed nothing the runner could read. What the page offers
instead is in its own note: “A good starting place for setting up the kernel
configuration is to run `make defconfig`. This will set the base configuration to
a good state that takes your current system architecture into account. Be sure to
enable/disable/set the following features or the system might not work correctly
or boot at all”, followed by the list. So: `make defconfig`, then every entry of
that list, in the page's order and with the page's states, applied with the
kernel's own `scripts/config` (`--set-str DRM_PANIC_SCREEN kmsg` for the one entry
whose book state is a value, `(kmsg)`), then `make olddefconfig` to let
dependencies settle. The page's 32-bit `HIGHMEM4G` entry is not applied, because
this is x86_64; its NVMe entry is applied whatever the disk, because it costs one
driver and the page's condition is about the machine.

Then the additions the page cannot know: this system's disk is virtio (`/dev/vda`,
driver `virtio_blk`) and there is no initramfs in the book's install step, so
every driver needed to mount the root filesystem has to be built in, not `m` —
`VIRTIO_PCI`, `VIRTIO_BLK`, `EXT4_FS`, `BLK_DEV_SD`, `ATA` — plus `SERIAL_8250`
and its console, which is how this build is watched at all.

Last, the list is a requirement, so the block asks the resulting `.config` whether
each entry held, and says which one did not. `make olddefconfig` is allowed to
refuse an option for a dependency the page did not mention; that is exactly the
news worth failing on rather than discovering at boot.
"""

# The book's own instruction for this page is “replace <xxx> with the name of the
# LFS partition”, and this build does — with `vdc1`, the name the partition has
# while the build guest is running. That name is not the name it has at boot: the
# overrides above say so (“At the first boot test the disk is the only disk
# attached and becomes /dev/vda”), and a root line naming a disk that is not
# there, with fsck order 1, is a boot that stops. So the two device names become
# `/dev/disk/by-uuid/…`, resolved by `blkid` when the page runs, which is the
# book's file with the book's instruction applied to a machine whose disk names
# move. The heredoc loses its quotes so the shell can expand them; nothing else in
# the file is special to the shell.
[page."chapter10/fstab.html".block_subst."1"]
'cat > /etc/fstab << "EOF"' = 'cat > /etc/fstab <<EOF'
"/dev/vdc1     /            ext4    defaults            1     1" = "/dev/disk/by-uuid/$(blkid -s UUID -o value /dev/vdc1) / ext4 defaults 1 1"
"/dev/vdc2     swap         swap     pri=1               0     0" = "/dev/disk/by-uuid/$(blkid -s UUID -o value /dev/vdc2) swap swap pri=1 0 0"
