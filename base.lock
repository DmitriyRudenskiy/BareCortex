#               carries none. The book publishes no revision field; this
#               is read off the URL, not looked up behind it.
# Format owner: base-system-and-init D3. Contents owner: build-orchestration 2.1.
#
# Provenance classes are rows of class-map.toml, not a sentence; every
# entry names its class and the book pages that build it, because 2.5
# rejects a line that carries no book revision and page.

