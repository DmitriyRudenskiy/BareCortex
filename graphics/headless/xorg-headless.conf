# BareCortex Headless Xorg Configuration
# Use this when no physical monitor is attached
# Place in: /etc/X11/xorg.conf.d/99-headless.conf
#
# Requires the xf86-video-dummy driver. Do not load this alongside
# 10-nvidia-multi-gpu.conf on the same ServerLayout.

Section "ServerFlags"
    Option         "AutoAddDevices" "false"
    Option         "AutoAddGPU" "false"
    Option         "AutoEnableDevices" "false"
EndSection

Section "Device"
    Identifier     "Dummy Device"
    Driver         "dummy"
    VideoRam       256000
EndSection

Section "Monitor"
    Identifier     "Dummy Monitor"
    HorizSync       28.0-80.0
    VertRefresh     48.0-75.0
    # 1920x1080 @ 60 Hz
    Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125 +hsync +vsync
EndSection

Section "Screen"
    Identifier     "Dummy Screen"
    Device         "Dummy Device"
    Monitor        "Dummy Monitor"
    DefaultDepth    24
    SubSection     "Display"
        Depth       24
        Modes       "1920x1080"
    EndSubSection
EndSection
