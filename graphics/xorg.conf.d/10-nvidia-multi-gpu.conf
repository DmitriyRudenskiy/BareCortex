# BareCortex Xorg configuration for multi-GPU NVIDIA setup
# Place in: /etc/X11/xorg.conf.d/10-nvidia-multi-gpu.conf
#
# Adjust the BusID values to match `nvidia-xconfig --query-gpu-info | grep BusID`
# (note: xorg.conf uses DECIMAL bus ids, nvidia-smi reports HEX).

Section "ServerLayout"
    Identifier     "BareCortex Multi-GPU"
    Screen      0  "Screen0" 0 0
    # Add more screens for additional GPUs if needed
    # Screen      1  "Screen1" RightOf "Screen0"
EndSection

Section "Device"
    Identifier     "NVIDIA GPU 0"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    BusID          "PCI:1:0:0"
    # Option "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Device"
    Identifier     "NVIDIA GPU 1"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    BusID          "PCI:2:0:0"
    # Option "AllowEmptyInitialConfiguration" "true"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "NVIDIA GPU 0"
    DefaultDepth    24
    Option         "AllowEmptyInitialConfiguration" "true"
    Option         "UseDisplayDevice" "none"
    SubSection     "Display"
        Depth       24
    EndSubSection
EndSection

Section "Screen"
    Identifier     "Screen1"
    Device         "NVIDIA GPU 1"
    DefaultDepth    24
    Option         "AllowEmptyInitialConfiguration" "true"
    Option         "UseDisplayDevice" "none"
    SubSection     "Display"
        Depth       24
    EndSubSection
EndSection

# Enable GLX for CUDA/OpenGL interop
Section "Extensions"
    Option         "GLX" "Enable"
EndSection
